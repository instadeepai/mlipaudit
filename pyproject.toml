[project]
name = "mlipaudit"
version = "0.1.4"
description = "Library and CLI tool for benchmarking ML Interatomic Potentials"
readme = "README.md"
authors = [
    { name = "InstaDeep", email = "placeholder@instadeep.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.33.4",
    "mdtraj>=1.10.3",
    "mlip>=0.2.0,<0.3.0",
    "scikit-learn>=1.7.0",
    "streamlit>=1.46.1",
    "vl-convert-python>=1.8.0",
    "mdtraj>=1.10.3",
    "tmtools>=0.2.0",
    "jax-md>=0.2.26",
]

[project.scripts]
mlipaudit = "mlipaudit.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
cuda = [
    "mlip[cuda13]>=0.2.0,<0.3.0",
]

# Temporary: the NVE energy-conservation benchmark needs the NVE velocity-Verlet
# integrator (MDIntegrator.NVE_VELOCITY_VERLET) and SimulationState.potential_energy,
# which are on mlip's `develop` branch but not yet in a published PyPI release. Pin to
# git `develop` until a release ships these, then drop this source to use the PyPI build.
[tool.uv.sources]
mlip = { git = "https://github.com/instadeepai/mlip-jax.git", branch = "develop" }

[dependency-groups]
dev = [
    "notebook>=7.4.4",
    "pytest>=8.4.1",
    "pre-commit>=4.1.0",
    "pytest-mock>=3.14.1",
    "sphinx>=8.1.3",
    "furo>=2025.7.19",
    "pytest-cov>=6.2.1",
    "sphinx-subfigure>=0.2.4",
]

# Omitting files related to CLI from test coverage
[tool.coverage.run]
omit = [
    "main.py",
    "app.py",
    "benchmarks_cli.py"
]

[project.urls]
"Homepage" = "https://github.com/instadeepai/mlipaudit/"

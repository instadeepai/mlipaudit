name: base-branch-guard

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

jobs:
  base-branch-guard:
    name: base-branch-guard
    # Only enforce for PRs whose base is `main`. The `on.pull_request.branches`
    # filter above is not by itself reliable here (the job has been observed
    # running on develop-targeted PRs), so gate on the resolved base ref too.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ensure PRs into main come from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "PRs into 'main' must come from 'develop' (got '${{ github.head_ref }}')."
            echo "See https://www.notion.so/instadeep/Release-pipeline-336ed6e1dfc480288045ef94266cab48"
            exit 1
          fi
          echo "OK: head branch is 'develop'."
